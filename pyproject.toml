[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psychometrics-mcp"
version = "0.8.0"
description = "A measurement-aware MCP server for reproducible psychometric analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Psychometrics MCP contributors" }]
dependencies = [
  "mcp>=2.1,<3",
  "numpy>=2.0,<3",
  "pydantic>=2.10,<3",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pip-audit>=2.10,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
psychometrics-mcp = "psychometrics_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
psychometrics_mcp = ["r/*.R"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
