name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: pytest -m 'not integration'
      - run: pip-audit
      - run: python -m build

  r-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::eRm
            any::jsonlite
            any::lavaan
            any::psych
            any::GPArotation
            any::semTools
      - run: python -m pip install '.[dev]'
      - run: pytest -m integration

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: psychometrics-mcp:test
      - run: docker run --rm --entrypoint python psychometrics-mcp:test /app/scripts/check_ordinal_invariance_mcp.py
